x-common-python-service: &common-python-service
  restart: unless-stopped
  depends_on:
    redis:
      condition: service_healthy
  networks:
    - cse-network

services:
  postgres:
    image: postgres:16-alpine
    container_name: cse-postgres
    environment:
      POSTGRES_DB: cse_finance
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cse_finance"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cse-network

  redis:
    image: redis:7-alpine
    container_name: cse-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cse-network

  node_orchestrator:
    build:
      context: ./nodeBackend
      dockerfile: Dockerfile
    container_name: cse-node-orchestrator
    env_file:
      - ./nodeBackend/.env.example
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/cse_finance
      REDIS_URL: redis://redis:6379/0
      CONSOLIDATED_PIPELINE_MODE: "true"
      INGESTION_EXTRACTION_PLATFORM_URL: http://ingestion_extraction_platform:8101
      DATA_QUALITY_INTELLIGENCE_ENGINE_URL: http://data_quality_intelligence_engine:8102
      REPORTING_DELIVERY_SERVICE_URL: http://reporting_delivery_service:8103
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ingestion_extraction_platform:
        condition: service_started
      data_quality_intelligence_engine:
        condition: service_started
      reporting_delivery_service:
        condition: service_started
    ports:
      - "3000:3000"
    volumes:
      - report_uploads:/tmp/reports
    networks:
      - cse-network

  ingestion_extraction_platform:
    <<: *common-python-service
    build: ./ingestion_extraction_platform
    container_name: cse-ingestion-extraction-platform
    environment:
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8101:8101"

  data_quality_intelligence_engine:
    <<: *common-python-service
    build: ./data_quality_intelligence_engine
    container_name: cse-data-quality-intelligence-engine
    environment:
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8102:8102"

  reporting_delivery_service:
    <<: *common-python-service
    build: ./reporting_delivery_service
    container_name: cse-reporting-delivery-service
    environment:
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8103:8103"

  frontend:
    build: ./frontend
    container_name: cse-frontend
    ports:
      - "3001:3000"
    volumes:
      - ./frontend/src:/app/src
    networks:
      - cse-network

volumes:
  postgres_data:
  report_uploads:

networks:
  cse-network:
    driver: bridge
